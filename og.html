.foot{margin-top:36px;padding-top:18px;border-top:3px solid #17140F;display:flex;gap:28px;align-items:baseline;font-size:28px;font-weight:700}

.foot span{color:#2E2920;font-weight:500}
.art{align-self:center}
.art svg{display:block;width:100%;height:auto;overflow:visible}
